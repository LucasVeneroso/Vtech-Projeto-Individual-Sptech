  <body onload="onloadEsconder()">
  
     <div class="janela">
      <div class="header-left dash-header">
        <h1>Vtech</h1>

        <div class="hello">
          <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
          <br />
        </div>
        <div class="btn-nav">
          <a href="#">
            <h3>Quiz</h3>
          </a>
        </div>
        <div class="btn-nav-white" id="dashboard">
          <a href="./dashboard.html">
            <h3>Gráficos</h3>
          </a>
        </div>

        <div class="btn-nav-white">
          <a href="./mural.html">
            <h3>Avaliações</h3>
          </a>
        </div>

        <div class="btn-logout" onclick="limparSessao()">
          <h3>Sair</h3>
        </div>
      </div>
      <button id="btnIniciarQuiz" onclick="iniciarQuiz()">INICIAR QUIZ</button>
      <div id="pontuacaoEJogo" class="container-quiz">

        <div id="pontuacao" class="flex-colunar width-fit-content border-primary">
            <div id="pontuacaoDuranteJogo" class="">
                <span class="width-fit-content">Quantidade de acertos: <span id="spanCertas"></span></span>
                <span class="width-fit-content">Quantidade de erros: <span id="spanErradas"></span></span>
            </div>
            <div id="pontuacaoFinalJogo" class="flex-colunar padding-8">
                <span id="pontuacaoFinal" class="width-fit-content">Pontuação Final:
                    <span id="spanPontuacaoFinal">***</span>
                </span>
                <span id="msgFinal" class="width-fit-content">***</span>
            </div>
        </div>

        <div id="jogo" class="width-fit-content flex-colunar border-secondary">

            <div id="infoQuestao" class="infoQuestao">
                <span>Questão atual: <span id="spanNumeroDaQuestaoAtual"></span> de <span id="qtdQuestoes"></span>
                    questões.</span>
            </div>

            <div id="perguntaDaQuestaoAtual" class="Pergunta">
                <p id="spanQuestaoExibida"></p>
            </div>

            <div id="infoAlternativas" class="padding-8">
                <span><em>Escolha uma opção dentre as abaixo:</em></span>
            </div>

            <div id="opcoes" class="flex-colunar padding-8">
                <span>
                    <input type="radio" id="primeiraOpcao" name="option" class="radio" value="alternativaA" />
                    <label for="primeiraOpcao" class="option" id="labelOpcaoUm"></label>
                </span>
                <span>
                    <input type="radio" id="segundaOpcao" name="option" class="radio" value="alternativaB" />
                    <label for="segundaOpcao" class="option" id="labelOpcaoDois"></label>
                </span>
                <span>
                    <input type="radio" id="terceiraOpcao" name="option" class="radio" value="alternativaC" />
                    <label for="terceiraOpcao" class="option" id="labelOpcaoTres"></label>
                </span>
                <span>
                    <input type="radio" id="quartaOpcao" name="option" class="radio" value="alternativaD" />
                    <label for="quartaOpcao" class="option" id="labelOpcaoQuatro"></label>
                </span>
                <span>
                    <input type="radio" id="quintaOpcao" name="option" class="radio" value="alternativaD" />
                    <label for="quintaOpcao" class="option" id="labelOpcaoCinco"></label>
                </span>
            </div>

            <div id="botoes" class="botoes">
                <button onclick="submeter()" id="btnSubmeter">Submeter resposta</button>
                <button onclick="avancar()" id="btnProx" disabled>Avançar para próxima questão</button>
                <button onclick="finalizarJogo()" id="btnConcluir" disabled>Finalizar Quiz</button> 
                <button onclick="tentarNovamente()" id="btnTentarNovamente" disabled>Tentar novamente</button>
            </div>

        </div>
    </div>
</body>
</html>
    <script>
        const listaDeQuestoes = [
    {

    },
    {
        pergunta: "Na seção 'Mas porque usar Nuvem?', qual das opções abaixo é citada como um dos três pontos essenciais?",
        alternativaA: "Design Moderno",
        alternativaB: "Facilidade de Programação",
        alternativaC: "Escalabilidade",
        alternativaD: "Brinde de Créditos Iniciais",
        alternativaE: "Suporte via Telefone 24h",
        alternativaCorreta: "alternativaC"
    },
    {
        pergunta: "Com base na sua explicação de SaaS, qual é a preocupação de uma empresa que contrata esse tipo de serviço?",
        alternativaA: "Gerenciar o sistema operacional e as atualizações.",
        alternativaB: "Comprar os racks e instalar o ar-condicionado.",
        alternativaC: "Manter apenas pequenas alterações no sistema, pois o resto é provisionado.",
        alternativaD: "Programar todo o código do zero.",
        alternativaE: "Configurar as placas de rede dos servidores.",
        alternativaCorreta: "alternativaC"
    },
    {
        pergunta: "Se uma empresa quer usar a infraestrutura pronta de outra empresa e acessá-la pela internet, sendo o usuário responsável por manter o sistema do servidor funcionando, qual modelo ela está usando?",
        alternativaA: "On-premises",

    },
    {
        pergunta: "No seu texto sobre o S3, ele é comparado a um diretório de arquivos, mas 'mil vezes melhor'. Qual a principal função dele na arquitetura?",
        alternativaA: "Processar dados em alta velocidade com o cérebro da nuvem.",
        alternativaB: "Ser o segurança que barra quem não tem permissão.",
        alternativaC: "Ser o responsável pela persistência dos dados, garantindo que nada seja perdido.",
        alternativaD: "Criar máquinas virtuais para rodar o Windows.",
        alternativaE: "Ligar e desligar o servidor conforme o pagamento.",
        alternativaCorreta: "alternativaC"
    },
    {
        pergunta: "No seu conteúdo, o IAM (Identity and Access Management) é comparado a qual profissional para facilitar o entendimento?",
        alternativaA: "Um Chef de cozinha preparando pizzas.",
        alternativaB: "Um Gerente de banco conferindo o saldo.",
        alternativaC: "Um Segurança de balada ou porteiro de prédio comercial.",
        alternativaD: "Um Programador escrevendo código em Python.",
        alternativaE: "Um Engenheiro Elétrico cuidando dos geradores.",
        alternativaCorreta: "alternativaC"
    },
    {
        pergunta: "Sobre o FaaS, você usa o exemplo de um aplicativo de banco para explicar sua eficiência. Por que esse modelo economiza dinheiro?",
        alternativaA: "Porque o banco não cobra taxas para quem usa FaaS.",
        alternativaB: "Porque o serviço só funciona e cobra pelos milissegundos quando é acionado.",
        alternativaC: "Porque ele roda 24 horas por dia sem parar.",

    },
    {
        pergunta: "De acordo com o texto de PaaS, qual é o foco principal dos desenvolvedores e programadores que utilizam esse modelo?",
        alternativaA: "Comprar servidores físicos e configurar o gás.",
        alternativaB: "Se preocupar apenas com o código e colocá-lo no ar.",
        alternativaC: "Limpar o chão do data center.",
        alternativaD: "Gerenciar o sistema operacional e as atualizações de segurança.",
        alternativaE: "Instalar cabos de fibra ótica.",
        alternativaCorreta: "alternativaB"
    },
    {
        pergunta: "Na seção de Segurança do seu site, você menciona que a nuvem oferece uma proteção superior, mas deixa um aviso importante para quem contrata. Qual é ele?",
        alternativaA: "A nuvem é a única responsável pela segurança total.",
        alternativaB: "A pessoa que contrata precisa saber o que faz para os dados não serem vazados.",
        alternativaC: "A segurança na nuvem é opcional e deve ser paga à parte.",
        alternativaD: "O IAM não funciona se o EC2 estiver desligado.",
        alternativaE: "Somente empresas americanas podem ter segurança na nuvem.",
        alternativaCorreta: "alternativaB"
    },
    {
        pergunta: "Segundo a história da nuvem no seu site, o que a Amazon lançou em 2006 que resolveu o antigo problema de compartilhamento de hardware de forma isolada?",
        alternativaA: "O primeiro iPhone.",
        alternativaB: "O serviço S3 de armazenamento.",
        alternativaC: "O serviço EC2 (Elastic Compute Cloud).",
        alternativaD: "O sistema operacional Windows.",
        alternativaE: "A rede social Facebook.",
        alternativaCorreta: "alternativaC"
    },
    {
        pergunta: "No seu texto sobre Escalabilidade, você menciona que esse recurso permitiu que um tipo específico de empresa surgisse 'do dia para a noite'. Que empresas são essas?",
        alternativaA: "Grandes bancos tradicionais.",
        alternativaB: "Diversas startups.",
        alternativaC: "Empresas de entrega de pizza física.",
        alternativaD: "Lojas de ferragens.",
        alternativaE: "Fábricas de servidores.",
        alternativaCorreta: "alternativaB"
    },
    {
        pergunta: "Uma empresa percebe que está gastando fortunas com servidores ligados 24/7 para um processo que só acontece quando um cliente faz um upload. Qual a mudança lógica baseada no seu conteúdo?",
        alternativaA: "Mudar do FaaS para o PaaS para garantir que o servidor nunca desligue.",
        alternativaB: "Mudar do PaaS para o FaaS, para que o código 'acorde' apenas no upload.",
        alternativaC: "Voltar para o On-premises para ter controle total dos cabos.",
        alternativaD: "Comprar mais instâncias EC2 para processar mais rápido.",
        alternativaE: "Usar o Outlook da Microsoft para resolver o problema de processamento.",
        alternativaCorreta: "alternativaB"
    },
    {
        pergunta: "Um usuário consegue invadir um sistema e deletar arquivos importantes. Analisando o seu texto sobre o IAM e Segurança, onde provavelmente ocorreu a falha?",
        alternativaA: "No S3, que não é escalável o suficiente para barrar invasores.",
        alternativaB: "No EC2, porque as máquinas virtuais eram 'muito fracas'.",
        alternativaC: "No IAM, pois ele é o 'guarda' que deveria definir quem pode ou não mexer nos serviços.",
        alternativaD: "No On-premises, pois a empresa esqueceu de comprar o hardware.",
        alternativaE: "Na Amazon, que é a única responsável por não deixar os dados vazarem.",
        alternativaCorreta: "alternativaC"
    }
];
    
        // variáveis globais    
        let numeroDaQuestaoAtual = 0
        let pontuacaoFinal = 0
        let tentativaIncorreta = 0
        let certas = 0
        let erradas = 0
        let quantidadeDeQuestoes = listaDeQuestoes.length
        // let isUltima = numeroDaQuestaoAtual == quantidadeDeQuestoes-1 ? true : false
    
        function onloadEsconder() {
            document.getElementById('pontuacao').style.display = "none"
            document.getElementById('pontuacaoEJogo').style.display = "none"
            document.getElementById('jogo').style.display = "none"
            document.getElementById('dashboard').style.display = "none"
        }
    
        function iniciarQuiz() {
            document.getElementById('jogo').style.display = "flex"
            document.getElementById('btnIniciarQuiz').style.display = "none"
            document.getElementById('btnConcluir').style.display = "none"
            document.getElementById('btnTentarNovamente').style.display = "none"
            document.getElementById('pontuacaoEJogo').style.display = "flex"
            document.getElementById('qtdQuestoes').innerHTML = quantidadeDeQuestoes
    
            preencherHTMLcomQuestaoAtual(0)
    
            btnSubmeter.disabled = false
            btnProx.disabled = true
            btnConcluir.disabled = true
            btnTentarNovamente.disabled = true
        }
    
        function preencherHTMLcomQuestaoAtual(index) {
            habilitarAlternativas(true)
            const questaoAtual = listaDeQuestoes[index]
            numeroDaQuestaoAtual = index
            console.log("questaoAtual")
            console.log(questaoAtual)
            document.getElementById("spanNumeroDaQuestaoAtual").innerHTML = Number(index) + 1 // ajustando porque o index começa em 0
            document.getElementById("spanQuestaoExibida").innerHTML = questaoAtual.pergunta;
            document.getElementById("labelOpcaoUm").innerHTML = questaoAtual.alternativaA;
            document.getElementById("labelOpcaoDois").innerHTML = questaoAtual.alternativaB;
            document.getElementById("labelOpcaoTres").innerHTML = questaoAtual.alternativaC;
            document.getElementById("labelOpcaoQuatro").innerHTML = questaoAtual.alternativaD;
            document.getElementById("labelOpcaoCinco").innerHTML = questaoAtual.alternativaE;
        }
    
        function submeter() {
            const options = document.getElementsByName("option"); // recupera alternativas no html
    
            let hasChecked = false
            for (let i = 0; i < options.length; i++) {
                if (options[i].checked) {
                    hasChecked = true
                    break
                }
            }
    
            if (!hasChecked) {
                alert("Não há alternativas escolhidas. Escolha uma opção.")
            } else {
                btnSubmeter.disabled = true
                btnProx.disabled = false
    
                habilitarAlternativas(false)
    
                checarResposta()
            }
        }
    
        function habilitarAlternativas(trueOrFalse) {
            let opcaoEscolhida = trueOrFalse ? false : true
    
            primeiraOpcao.disabled = opcaoEscolhida
            segundaOpcao.disabled = opcaoEscolhida
            terceiraOpcao.disabled = opcaoEscolhida
            quartaOpcao.disabled = opcaoEscolhida
            quintaOpcao.disabled = opcaoEscolhida
    
        }
    
        function avancar() {
            btnProx.disabled = true
            btnSubmeter.disabled = false
    
            desmarcarRadioButtons()
    
            if (numeroDaQuestaoAtual < quantidadeDeQuestoes) {
                preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual)
            } else if(numeroDaQuestaoAtual == 2){
            document.getElementById('dashboard').style.display = "flex"
            }else {
                finalizarJogo()
            }
            limparCoresBackgroundOpcoes()
        }
    
        function tentarNovamente() {
            // atualiza a página
            window.location.reload()
        }
    
        function checarResposta() {
            const questaoAtual = listaDeQuestoes[numeroDaQuestaoAtual] // questão atual 
            const respostaQuestaoAtual = questaoAtual.alternativaCorreta // qual é a resposta correta da questão atual
    
            const options = document.getElementsByName("option"); // recupera alternativas no html
    
            let alternativaCorreta = null // variável para armazenar a alternativa correta
    
            options.forEach((option) => {
                if (option.value === respostaQuestaoAtual) {
                    console.log("alternativaCorreta está no componente: " + alternativaCorreta)
                    alternativaCorreta = option.labels[0].id
                }
            })
    
            // verifica se resposta assinalada é correta
            options.forEach((option) => {
                if (option.checked === true && option.value === respostaQuestaoAtual) {
                    document.getElementById(alternativaCorreta).classList.add("text-success-with-bg")
                    pontuacaoFinal++
                    certas++
                    document.getElementById("spanCertas").innerHTML = certas
                    numeroDaQuestaoAtual++
                } else if (option.checked && option.value !== respostaQuestaoAtual) {
                    const wrongLabelId = option.labels[0].id
    
                    document.getElementById(wrongLabelId).classList.add("text-danger-with-bg")
                    document.getElementById(alternativaCorreta).classList.add("text-success-with-bg")
                    tentativaIncorreta++
                    erradas++
                    document.getElementById("spanErradas").innerHTML = erradas
                    numeroDaQuestaoAtual++
                }
            })
        }
    
        function limparCoresBackgroundOpcoes() {
            const options = document.getElementsByName("option");
            options.forEach((option) => {
                document.getElementById(option.labels[0].id).classList.remove("text-danger-with-bg")
                document.getElementById(option.labels[0].id).classList.remove("text-success-with-bg")
            })
        }
    
        function desmarcarRadioButtons() {
            const options = document.getElementsByName("option");
            for (let i = 0; i < options.length; i++) {
                options[i].checked = false;
            }
        }
    
        function finalizarJogo() {
            let textoParaMensagemFinal = null
            let classComCoresParaMensagemFinal = null
            const porcentagemFinalDeAcertos = pontuacaoFinal / quantidadeDeQuestoes
    
            if (porcentagemFinalDeAcertos <= 0.3) {
                textoParaMensagemFinal = "Parece que você não estudou..."
                classComCoresParaMensagemFinal = "text-danger-with-bg"
            }
            else if (porcentagemFinalDeAcertos > 0.3 && porcentagemFinalDeAcertos < 0.9) {
                textoParaMensagemFinal = "Pode melhorar na próxima, hein!"
                classComCoresParaMensagemFinal = "text-warning-with-bg"
            }
            else if (porcentagemFinalDeAcertos >= 0.9) {
                textoParaMensagemFinal = "Uau, parabéns!"
                classComCoresParaMensagemFinal = "text-success-with-bg"
            }
    
            textoParaMensagemFinal += "<br> Você acertou " + Math.round((porcentagemFinalDeAcertos)*100) + "% das questões."
    
    
            document.getElementById('msgFinal').innerHTML = textoParaMensagemFinal
            document.getElementById('msgFinal').classList.add(classComCoresParaMensagemFinal) 
            document.getElementById('spanPontuacaoFinal').innerHTML = pontuacaoFinal
    
            document.getElementById('jogo').classList.add("text-new-gray") 
    
            btnProx.disabled = true
            btnSubmeter.disabled = true
            btnConcluir.disabled = false
            btnTentarNovamente.disabled = false
    
        }
    </script>
