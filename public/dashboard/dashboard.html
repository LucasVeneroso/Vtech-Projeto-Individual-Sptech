<!doctype html>
<html lang="pt-br">
  <head>
    <link rel="icon" href="../assets/imgs/favicom.png" />

    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VTech</title>
    <link rel="stylesheet" href="./../css/dashboards.css" />
    <link rel="stylesheet" href="./../css/estilo.css" />
    <script src="../js/sessao.js"></script>
    <script src="./../js/alerta.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script
      src="https://kit.fontawesome.com/9f7414eb10.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body onload="iniciarDashboard()">
    <div class="">
      <div class="header-left">
        <h1>Vtech</h1>

        <div class="hello">
          <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
        </div>

        <div class="btn-nav-white">
          <a href="./quiz.html">
            <h3>Quiz</h3>
          </a>
        </div>

        <div class="btn-nav">
          <h3>Gráficos</h3>
        </div>
        <div class="btn-logout" onclick="limparSessao()">
          <h3>Sair</h3>
        </div>
      </div>
    </div>
    <div class="dash">
      <div class="kpis">
        <div class="kpi" id="Pontos_melhorar">
          <h1>Pontos a Melhorar</h1>
          <ul id="lista_feedback_melhorar"></ul>
        </div>
        <div class="kpi">
          <h1>Acertos</h1>
          <canvas id="porcentagem"></canvas>
        </div>
        <div class="kpi" id="Pontos_bom">
          <h1>Pontos Fortes</h1>
          <ul id="lista_feedback_bom"></ul>
        </div>
      </div>
      <div id="grafico">
        <canvas id="myChart"></canvas>
      </div>
      <div class="certificado">
        <h1>Certificado Vtech</h1>
        <div class="container-certificado">
          <div class="certificado-texto">
            <h2>
              Seu Desempenho:
              <p id="entregaCertificado"></p>
            </h2>
          </div>
          <div class="certificado-imagem">
            <img src="../assets/imgs/CertificadoVtech.png" alt="" />
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  b_usuario.innerHTML = sessionStorage.NOME_USUARIO;
  idUsuario = sessionStorage.ID_USUARIO;

  let proximaAtualizacao;

  window.onload = iniciarDashboard;

  function iniciarDashboard() {
    if (idUsuario) {
      obterDadosGrafico(idUsuario);
      obterDadosGraficoPorcentagem(idUsuario);
    } else {
      console.error("ID do usuário não encontrado na sessão.");
    }
  }

  function exibirAquario(idUsuario) {
    let todosOsGraficos = JSON.parse(sessionStorage.AQUARIOS);

    for (i = 0; i < todosOsGraficos.length; i++) {
      if (todosOsGraficos[i].id != idUsuario) {
        let elementoAtual = document.getElementById(
          `grafico${todosOsGraficos[i].id}`,
        );
        if (elementoAtual.classList.contains("display-block")) {
          elementoAtual.classList.remove("display-block");
        }
        elementoAtual.classList.add("display-none");

        let btnAtual = document.getElementById(
          `btnAquario${todosOsGraficos[i].id}`,
        );
        if (btnAtual.classList.contains("btn-pink")) {
          btnAtual.classList.remove("btn-pink");
        }
        btnAtual.classList.add("btn-white");
      }
    }

    let graficoExibir = document.getElementById(`grafico${idUsuario}`);
    graficoExibir.classList.remove("display-none");
    graficoExibir.classList.add("display-block");

    let btnExibir = document.getElementById(`btnAquario${idUsuario}`);
    btnExibir.classList.remove("btn-white");
    btnExibir.classList.add("btn-pink");
  }

  function obterDadosGrafico(idUsuario) {
    fetch(`/quiz/listarDados/${idUsuario}`, { cache: "no-store" })
      .then(function (response) {
        if (response.ok) {
          response.json().then(function (resposta) {
            console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
            resposta.reverse();

            plotarGrafico(resposta, idUsuario);
          });
        } else {
          console.error("Nenhum dado encontrado ou erro na API");
        }
      })
      .catch(function (error) {
        console.error(
          `Erro na obtenção dos dados p/ gráfico: ${error.message}`,
        );
      });
  }

  function plotarGrafico(resposta, idUsuario) {
    console.log("iniciando plotagem do gráfico...");

    const labelsMatérias = [
      "História",
      "Modelos",
      "Estratégia",
      "EC2",
      "S3",
      "IAM",
    ];

    let dadosGrafico = {
      labels: labelsMatérias,
      datasets: [
        {
          label: "Desempenho por Matéria",
          data: [],
          backgroundColor: [
            "#012748",
          ],
          borderColor: "#00f2ff",
          borderWidth: 2,
          borderRadius: 5,
        },
      ],
    };
    let mensagemRuim = "";
    let mensagemBoa = "";

    for (i = 0; i < resposta.length; i++) {
      var registro = resposta[i];
      dadosGrafico.datasets[0].data.push(
        registro.historia_nuvem,
        registro.nuvem,
        registro.vantagens_nuvem,
        registro.ec2,
        registro.s3,
        registro.iam,
      );

      if (registro.historia_nuvem <= 1) {
        mensagemRuim += "<li>História Da Nuvem</li>";
      }
      if (registro.nuvem <= 1) {
        mensagemRuim += "<li>Conceitos gerais de nuvem</li>";
      }
      if (registro.vantagens_nuvem <= 1) {
        mensagemRuim += "<li>Vantagens da Nuvem</li>";
      }
      if (registro.ec2 <= 1) {
        mensagemRuim += "<li>Conceito de Ec2</li>";
      }
      if (registro.s3 <= 1) {
        mensagemRuim += "<li>Conceito de S3</li>";
      }
      if (registro.iam <= 1) {
        mensagemRuim += "<li>Conceito de IAM</li>";
      }
      if (registro.historia_nuvem >= 2) {
        mensagemBoa += "<li>História Da Nuvem</li>";
      }
      if (registro.nuvem >= 2) {
        mensagemBoa += "<li>Conceitos gerais de nuvem</li>";
      }
      if (registro.vantagens_nuvem >= 2) {
        mensagemBoa += "<li>Vantagens da Nuvem</li>";
      }
      if (registro.ec2 >= 2) {
        mensagemBoa += "<li>Conceito de Ec2</li>";
      }
      if (registro.s3 >= 2) {
        mensagemBoa += "<li>Conceito de S3</li>";
      }
      if (registro.iam >= 2) {
        mensagemBoa += "<li>Conceito de IAM</li>";
      }
    }

    const configBarras = {
      type: "bar",
      data: dadosGrafico,
      options: {
        responsive: true,
        scales: {
          y: {
            beginAtZero: true,
            min: 0,
            max: 3,
            ticks: {
              stepSize: 1,
              color: "#212124",
            },
          },
          x: {
            grid: {
              display: false,
            },
          },
        },
      },
    };

    const chartBarras = new Chart(
      document.getElementById("myChart"),
      configBarras,
    );
    lista_feedback_melhorar.innerHTML = mensagemRuim;
    lista_feedback_bom.innerHTML = mensagemBoa;
  }

  function obterDadosGraficoPorcentagem(idUsuario) {
    fetch(`/quiz/contarAcertos/${idUsuario}`, { cache: "no-store" })
      .then(function (response) {
        if (response.ok) {
          response.json().then(function (respostaPorcentagem) {
            console.log(
              `Dados recebidos: ${JSON.stringify(respostaPorcentagem)}`,
            );
            respostaPorcentagem.reverse();
            contarAcertos(respostaPorcentagem, idUsuario);
          });
        } else {
          console.error("Nenhum dado encontrado ou erro na API");
        }
      })
      .catch(function (error) {
        console.error(
          `Erro na obtenção dos dados p/ gráfico de porcentagem: ${error.message}`,
        );
      });
  }

  function contarAcertos(respostaPorcentagem, idUsuario) {
    let pluginTextoCentral = {
      id: "textoCentro",
      afterDraw: function (chart) {
        let ctx = chart.ctx;
        let chartArea = chart.chartArea;

        let x = (chartArea.left + chartArea.right) / 2;
        let y = (chartArea.top + chartArea.bottom) / 1.4;

        ctx.save();

        ctx.textAlign = "center";

        let textoAcertos = chart.data.textoAcertos || "0 / 18";
        let textoPorcentagemAcertos = chart.data.textoPorcentagem || "0%";

        // Numero de acertos
        ctx.font = "bold 32px Arial";
        ctx.fillStyle = "#333";
        ctx.fillText(resultado.num_acertos + " / 18", x, y);

        // %
        ctx.font = "20px Arial";
        ctx.fillText(
          ((Number(resultado.num_acertos) / 18) * 100).toFixed(2) + "% ",
          x,
          y + 30,
        );

        ctx.restore();
      },
    };
    let configPorcentagem = {
      type: "doughnut",
      labels: ["Acertos", "Erros"],
      data: {
        datasets: [
          {
            label: "Porcentagem",
            data: [],
            backgroundColor: ["green", "red"],
            borderWidth: 0,
          },
        ],
      },
      options: {
        rotation: -90,
        circumference: 180,
        cutout: "70%",
        plugins: {
          legend: { display: false },
        },
        responsive: false,
        maintainAspectRatio: true,
      },
      plugins: [pluginTextoCentral],
    };

    let mensagemCertificado = "";

    for (let i = 0; i < respostaPorcentagem.length; i++) {
      resultado = respostaPorcentagem[i];
      let acertos = Number(resultado.num_acertos);
      let porcentagemAcertos = (acertos / 18) * 100;
      let porcentagemErros = 100 - porcentagemAcertos;

      configPorcentagem.data.datasets[i].data.push(
        porcentagemAcertos,
        porcentagemErros,
      );
      if (porcentagemAcertos >= 75) {
        mensagemCertificado = `<p>Parabens pequeno gafanhofo, você chegou ao final da jornada rápida sobre nuvem, agora você pode baixar o certificado para se lembrar que você aprendeu o básico sobre nuvem, espero que eu possa ter ajudado nos seus estudos, muito obrigado pela participação!! </p><br> 
      <a target="_blank" href="https://drive.google.com/drive/folders/1sLuX6SM5oK4wlohJg4KmwuUn1SOp_9EV?usp=sharing" style="text-decoration: none; color: #32b9cd;">Faça o dowload do seu certificado!</a>`;
      } else {
        mensagemCertificado = `<p>Putz, parece que você não foi tão bem assim né? <br> Eu recomendo que você treine mais um pouco com o conteúdo que eu fiz e com os sites que eu passei, acho que seria bom para você caso queira virar um programador, muito obrigado por ter participado do treinamento da Vtech, estude mais com base no meu feedback, se você acertar mais questões na próxima você ganha uma surpresa, se eu fosse você não perderia tempo<p>`;
      }
    }
    entregaCertificado.innerHTML = mensagemCertificado;
    const chartPorcentagem = new Chart(
      document.getElementById("porcentagem"),
      configPorcentagem,
    );
  }

  function limparSessao() {
    sessionStorage.clear();
    window.location = "../index.html";
  }
</script>
