<!doctype html>
<html lang="pt-br">
  <head>
    <link rel="icon" href="../assets/imgs/favicom.png" />

    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VTech</title>
    <link rel="stylesheet" href="./../css/dashboards.css" />
    <link rel="stylesheet" href="./../css/estilo.css" />
    <script src="../js/sessao.js"></script>
    <script src="./../js/alerta.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script
      src="https://kit.fontawesome.com/9f7414eb10.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body onload="atualizarFeed()">
    <div class="">
      <div class="header-left">
        <h1>Vtech</h1>

        <div class="hello">
          <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
        </div>

        <div class="btn-nav-white">
          <a href="./quiz.html">
            <h3>Quiz</h3>
          </a>
        </div>

        <div class="btn-nav">
          <h3>Gráficos</h3>
        </div>

        <div class="btn-nav-white">
          <a href="./mural.html">
            <h3>Avaliações</h3>
          </a>
        </div>

        <div class="btn-logout" onclick="limparSessao()">
          <h3>Sair</h3>
        </div>
      </div>
    </div>
    <div class="dash">
      <div class="kpis">
        <div class="kpi"><span>20</span></div>
        <div class="kpi">
          <canvas id="porcentagem"></canvas>
        </div>
        <div class="kpi"><span>Onde Melhorar</span></div>
      </div>
      <div id="grafico">
        <canvas id="myChart"></canvas>
      </div>
      <div class="kpi" id="feedback">
        <h1>feedback sobre seu Desempenho</h1>
        <div id="pontos_a_mehorar">
          <li id="lista_feedback">
            Pontos a Melhorar
            <ul></ul>
          </li>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  b_usuario.innerHTML = sessionStorage.NOME_USUARIO;
  fkUsuario = sessionStorage.ID_USUARIO;

  let proximaAtualizacao;

  window.onload = iniciarDashboard();

  function iniciarDashboard() {
    const dados = [];
    plotarGrafico(dados, fkUsuario);
  }

  function alterarTitulo(fkUsuario) {
    var tituloAquario = document.getElementById(`tituloAquario${fkUsuario}`);
    var descricao = JSON.parse(sessionStorage.AQUARIOS).find(
      (item) => item.id == fkUsuario,
    ).descricao;
    tituloAquario.innerHTML =
      "Últimas medidas de Temperatura e Umidade do <span style='color: #e6005a'>" +
      descricao +
      "</span>";
  }

  function exibirAquario(fkUsuario) {
    let todosOsGraficos = JSON.parse(sessionStorage.AQUARIOS);

    for (i = 0; i < todosOsGraficos.length; i++) {
      if (todosOsGraficos[i].id != fkUsuario) {
        let elementoAtual = document.getElementById(
          `grafico${todosOsGraficos[i].id}`,
        );
        if (elementoAtual.classList.contains("display-block")) {
          elementoAtual.classList.remove("display-block");
        }
        elementoAtual.classList.add("display-none");

        let btnAtual = document.getElementById(
          `btnAquario${todosOsGraficos[i].id}`,
        );
        if (btnAtual.classList.contains("btn-pink")) {
          btnAtual.classList.remove("btn-pink");
        }
        btnAtual.classList.add("btn-white");
      }
    }

    let graficoExibir = document.getElementById(`grafico${fkUsuario}`);
    graficoExibir.classList.remove("display-none");
    graficoExibir.classList.add("display-block");

    let btnExibir = document.getElementById(`btnAquario${fkUsuario}`);
    btnExibir.classList.remove("btn-white");
    btnExibir.classList.add("btn-pink");
  }

  function obterDadosGrafico(quiz) {
    alterarTitulo(quiz);

    if (proximaAtualizacao != undefined) {
      clearTimeout(proximaAtualizacao);
    }

    fetch(`/quiz/listarDados/:${fkUsuario}}`, { cache: "no-store" })
      .then(function (response) {
        if (response.ok) {
          response.json().then(function (resposta) {
            console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
            resposta.reverse();

            plotarGrafico(resposta, fkUsuario);
          });
        } else {
          console.error("Nenhum dado encontrado ou erro na API");
        }
      })
      .catch(function (error) {
        console.error(
          `Erro na obtenção dos dados p/ gráfico: ${error.message}`,
        );
      });
  }

  function plotarGrafico(resposta, fkUsuario) {
    console.log("iniciando plotagem do gráfico...");

    const labelsMatérias = [
      "História",
      "Modelos",
      "Estratégia",
      "EC2",
      "S3",
      "IAM",
    ];

    const dadosGrafico = {
      labels: labelsMatérias,
      datasets: [
        {
          label: "Desempenho por Matéria",
          data: [3, 3, 3, 3, 3, 3],
          backgroundColor: [
            "rgba(0, 242, 255, 0.5)",
            "rgba(127, 0, 255, 0.5)",
            "rgba(0, 255, 127, 0.5)",
            "rgba(0, 242, 255, 0.5)",
            "rgba(127, 0, 255, 0.5)",
            "rgba(0, 255, 127, 0.5)",
          ],
          borderColor: "#00f2ff",
          borderWidth: 2,
          borderRadius: 5,
        },
      ],
    };

    if (Array.isArray(resposta) && resposta.length) {
      const valores = resposta.map((r) => r.acertos || 0);
      dadosGrafico.datasets[0].data = valores;
    }

    const configBarras = {
      type: "bar",
      data: dadosGrafico,
    };

    const configPorcentagem = {
      type: "doughnut",
      data: {
        datasets: [
          {
            data: [70, 30],
            backgroundColor: ["#8BC34A", "#324001"],
            borderWidth: 0,
          },
        ],
      },
      options: {
        rotation: -90,
        circumference: 180,
        cutout: "70%",
        plugins: {
          legend: { display: false },
        },
        responsive: true,
        maintainAspectRatio: false,
      },
    };

    const chartBarras = new Chart(
      document.getElementById("myChart"),
      configBarras,
    );
    const chartPorcentagem = new Chart(
      document.getElementById("porcentagem"),
      configPorcentagem,
    );
  }

  function atualizarGrafico(fkUsuario, dados, myChart) {
    fetch(`/quiz/listarDados/:${fkUsuario}`, { cache: "no-store" })
      .then(function (response) {
        if (response.ok) {
          response.json().then(function (novoRegistro) {
            obterdados(fkUsuario);
            console.log(`Dados recebidos: ${JSON.stringify(novoRegistro)}`);
            console.log(`Dados atuais do gráfico:`);
            console.log(dados);

            let avisoCaptura = document.getElementById(
              `avisoCaptura${fkUsuario}`,
            );
            avisoCaptura.innerHTML = "";

            if (
              novoRegistro[0].momento_grafico ==
              dados.labels[dados.labels.length - 1]
            ) {
              console.log(
                "---------------------------------------------------------------",
              );
              console.log(
                "Como não há dados novos para captura, o gráfico não atualizará.",
              );
              avisoCaptura.innerHTML =
                "<i class='fa-solid fa-triangle-exclamation'></i> Foi trazido o dado mais atual capturado pelo sensor. <br> Como não há dados novos a exibir, o gráfico não atualizará.";
              console.log("Horário do novo dado capturado:");
              console.log(novoRegistro[0].momento_grafico);
              console.log("Horário do último dado capturado:");
              console.log(dados.labels[dados.labels.length - 1]);
              console.log(
                "---------------------------------------------------------------",
              );
            } else {
              dados.labels.shift();
              dados.labels.push(novoRegistro[0].momento_grafico);

              dados.datasets[0].data.shift();
              dados.datasets[0].data.push(novoRegistro[0].umidade);

              dados.datasets[1].data.shift();
              dados.datasets[1].data.push(novoRegistro[0].temperatura);

              myChart.update();
            }

            proximaAtualizacao = setTimeout(
              () => atualizarGrafico(fkUsuario, dados, myChart),
              2000,
            );
          });
        } else {
          console.error("Nenhum dado encontrado ou erro na API");
          proximaAtualizacao = setTimeout(
            () => atualizarGrafico(fkUsuario, dados, myChart),
            2000,
          );
        }
      })
      .catch(function (error) {
        console.error(
          `Erro na obtenção dos dados p/ gráfico: ${error.message}`,
        );
      });
  }
  function limparSessao() {
    sessionStorage.clear();
    window.location = "../index.html";
  }
</script>
